server:
  # Interface the RPyC server listens on. The server has no authentication, so keep this on
  # localhost unless remote clients are needed (e.g. 0.0.0.0 to listen on all interfaces).
  host: localhost
  port: 18861
  memory_limit: 1073741824
  health_check_interval: 5.0
  max_failed_heartbeats: 2
  startup_wait: 5.0
  # How often (seconds) the server checks that its Stream Decks are still there, reopening one that came back
  # (e.g. after the PC slept) and redrawing its page.
  device_watch_interval: 2.0
  # Plugin install/uninstall is normally limited to clients on the server's own machine.
  allow_remote_plugin_install: false
  # How long (seconds) a stopping server gets to shut down on request before it is terminated.
  stop_timeout: 10.0

client:
  server_host: localhost
  server_port: 18861
  # Closing the main window hides it to the system tray instead of quitting (if a tray is available).
  close_to_tray: true

plugin:
  # Plugin processes using more resident memory than this (bytes) are killed.
  memory_limit: 268435456
  # Plugin repository index URLs, highest priority first.
  repositories:
    - https://valsr.github.io/decker-plugins/index.json
  # How often to check installed plugins for updates: daily, weekly, monthly or manual.
  update_check: weekly

icons:
  # Icon theme for the System Icons library (an installed freedesktop theme name).
  # Empty: use the desktop's current theme (GTK or KDE settings), else Adwaita.
  system_theme: ""
animation:
  # Animate keys whose icon is an animated GIF; false shows each GIF's first frame only.
  enabled: true
  # Share of each deck's USB write time (busy percent) animations may use, 10 to 90. Image quality and frame rate
  # are lowered when the measured load stays above it and raised again below about two thirds of it.
  budget_percent: 75
  # Memory for encoded animation frames, shared by all decks (MiB, at least 1). A GIF whose frames do not fit
  # stays a still image.
  cache_mb: 64
