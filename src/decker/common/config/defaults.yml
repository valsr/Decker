server:
  # Interface the RPyC server listens on. The server has no authentication, so keep this on
  # localhost unless remote clients are needed (e.g. 0.0.0.0 to listen on all interfaces).
  host: localhost
  port: 18861
  memory_limit: 1073741824
  health_check_interval: 5.0
  max_failed_heartbeats: 2
  startup_wait: 5.0

client:
  server_host: localhost
  server_port: 18861
  # Closing the main window hides it to the system tray instead of quitting (if a tray is available).
  close_to_tray: true

plugin:
  nodejs_path: node
