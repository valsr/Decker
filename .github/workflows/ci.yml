name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-poetry
      - run: poetry run black --check .
      - run: poetry run isort --check .

  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y enchant-2 libhidapi-dev
      - uses: ./.github/actions/setup-poetry
      - run: poetry run pylint .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-poetry
      - run: poetry run mypy .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libhidapi-dev
      - uses: ./.github/actions/setup-poetry
      - run: poetry run pytest --junitxml=report.xml --cov-report xml:coverage.xml --cov=decker tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            report.xml
            coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: [format, pylint, mypy, test]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-poetry
      - run: poetry build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
