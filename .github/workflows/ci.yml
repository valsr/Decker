name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-poetry
      - run: poetry run black --check .
      - run: poetry run isort --check .

  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y enchant-2 hunspell-en-ca libhidapi-dev
      - uses: ./.github/actions/setup-poetry
      - run: poetry run pylint .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-poetry
      - run: poetry run mypy .
      - run: poetry run mypy --platform win32 .
      - run: poetry run mypy --platform darwin .

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libhidapi-dev libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - if: runner.os == 'macOS'
        run: |
          brew install hidapi cairo
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        id: msys
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: mingw-w64-x86_64-cairo mingw-w64-x86_64-hidapi
      - if: runner.os == 'Windows'
        run: echo "${{ steps.msys.outputs.msys2-location }}/mingw64/bin" >> "$GITHUB_PATH"
        shell: bash
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/setup-poetry
      - run: poetry run pytest --junitxml=report.xml --cov-report xml:coverage.xml --cov=decker tests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ runner.os }}
          path: |
            report.xml
            coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: [format, pylint, mypy, test]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-poetry
      - run: poetry build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
