stages:
- lint
- sast
- test
- build

before_script:
  - pip install poetry poethepoet
  - poetry install
  - source `poetry env info --path`/bin/activate

default:
  image: python:3.11

# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/pipeline/#customization
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

format:
  stage: lint
  script:
  - black --check .
  - isort --check .

pylint:
  stage: lint
  script:
  - pylint .

mypy:
  stage: lint
  script:
  - mypy .

sast:
  stage: sast
include:
- template: Security/SAST.gitlab-ci.yml

test:
  stage: test
  script:
  - pytest --junitxml=report.xml --cov-report xml:coverage.xml --cov=decker_server tests
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        format: cobertura
        path: coverage.xml

build:
  stage: build
  only:
  - merge_requests
  script:
  - poetry build

publish:
  stage: build
  only:
  - main
  - release/*
  script:
  - echo -e "\e[32mBuilding project\e[0m"
  - poetry build
  - echo "\e[32mPublishing project\e[0m"
  - poetry config repositories.gitlab https://gitlab.com/api/v4/projects/67591431/packages/pypi
  - poetry publish --repository gitlab -u valsr -p CI_JOB_TOKEN
